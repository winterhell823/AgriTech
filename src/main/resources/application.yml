server:
  port: 8080

spring:
  application:
    name: AgriTech-Backend
  profiles:
    active: dev

ai-service:
  url: http://localhost:8000/api/v1
  base-url: ${ai-service.url}
  connect-timeout-ms: 5000
  read-timeout-ms: 30000

aws:
  s3:
    bucket: crop-intelligence-rasters-2026
    region: us-east-1
    access-key: dummy
    secret-key: dummy

---
# Dev Profile (In-Memory H2 for Fast Local Development)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:agritechdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
# Postgres Profile (Real PostgreSQL 16 + PostGIS Spatial Database)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agritech_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: update
