<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fieldGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6f39" />
      <stop offset="100%" stop-color="#2f5d35" />
    </linearGradient>
    <linearGradient id="fieldGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b7b4b" />
