server:
  port: 8080

spring:
  application:
    name: AgriTech-Backend
  datasource:
    url: jdbc:h2:mem:agritechdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

ai-service:
  url: http://localhost:8000/api/v1
  connect-timeout-ms: 5000
  read-timeout-ms: 30000

aws:
  s3:
    bucket: crop-intelligence-rasters-2026
    region: us-east-1
