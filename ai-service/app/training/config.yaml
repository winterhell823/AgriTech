training:
  batch_size: 8
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_epochs: 3
  device: "cuda"

loss_weights:
  crop_type: 0.4
  phenology_stage: 0.3
  moisture_stress: 0.3

checkpointing:
  save_dir: "checkpoints"
  release_dir: "checkpoints/release"
  save_every_n_epochs: 5
